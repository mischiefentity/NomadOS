# Keep plenty of terminal output available for selecting
scrollback_lines 100000

# Make Kitty's scrollback-position indicator fully visible
scrollback_indicator_opacity 1.0

# Font
font_family monospace
font_size 18.0

# Glass-like transparency
background_opacity 0.68
dynamic_background_opacity yes

# Spacing
window_padding_width 14

# Cursor
cursor_shape beam
cursor_blink_interval 0.5
cursor #d99a62
cursor_text_color #17191a

# Window behavior
confirm_os_window_close 0

# Colors
foreground #e6d6bd
background #17191a
selection_foreground #f4eadc
selection_background #9b6641

color0  #3b4252
color1  #bf616a
color2  #a3be8c
color3  #ebcb8b
color4  #81a1c1
color5  #b48ead
color6  #88c0d0
color7  #e5e9f0
color8  #4c566a
color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
