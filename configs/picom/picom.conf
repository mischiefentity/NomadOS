backend = "xrender";
vsync = false;

# Rounded windows
corner-radius = 12;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.25;
shadow-offset-x = -5;
shadow-offset-y = -5;

# Glass blur
# blur-method = "dual_kawase";
# blur-strength = 2;

# blur-background = false;
# blur-background-frame = false;

# Smooth fading
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 5;

# Keep menus and panels usable
opacity-rule = [
    "65:class_g = 'kitty'",
    "65:class_g = 'Rofi'",
    "65:class_g = 'Polybar'"
];
